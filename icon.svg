<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="22%" r="85%">
      <stop offset="0" stop-color="#2f7a4a"/>
      <stop offset=".45" stop-color="#123d25"/>
      <stop offset="1" stop-color="#050d08"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffb627" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffb627" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe04a"/>
      <stop offset=".6" stop-color="#ffb627"/>
      <stop offset="1" stop-color="#ff5a1f"/>
    </linearGradient>
    <linearGradient id="ball" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c0662b"/>
      <stop offset=".55" stop-color="#8a3f15"/>
      <stop offset="1" stop-color="#4f1f07"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
    <clipPath id="sq"><rect width="1024" height="1024" rx="0"/></clipPath>
  </defs>
  <g clip-path="url(#sq)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <!-- yard lines -->
    <g stroke="#ffffff" stroke-opacity=".07" stroke-width="10">
      <line x1="112" y1="0" x2="112" y2="1024"/><line x1="312" y1="0" x2="312" y2="1024"/>
      <line x1="712" y1="0" x2="712" y2="1024"/><line x1="912" y1="0" x2="912" y2="1024"/>
    </g>
    <!-- stadium light beams -->
    <path d="M512 -40 L300 1024 L724 1024 Z" fill="#ffffff" opacity=".04"/>
    <circle cx="512" cy="540" r="420" fill="url(#glow)"/>
    <!-- stopwatch -->
    <rect x="462" y="96" width="100" height="64" rx="18" fill="#e9efe9"/>
    <rect x="490" y="150" width="44" height="40" fill="#c9d3cb"/>
    <rect x="726" y="196" width="66" height="44" rx="14" fill="#c9d3cb" transform="rotate(45 759 218)"/>
    <circle cx="512" cy="550" r="338" fill="#0b1510" stroke="#e9efe9" stroke-width="30"/>
    <circle cx="512" cy="550" r="290" fill="none" stroke="#1d2e24" stroke-width="44"/>
    <!-- remaining time arc (~85%) -->
    <circle cx="512" cy="550" r="290" fill="none" stroke="url(#arc)" stroke-width="44" stroke-linecap="round"
            stroke-dasharray="1549 1822" transform="rotate(-90 512 550)"/>
    <circle cx="512" cy="550" r="290" fill="none" stroke="#ffb627" stroke-width="44" stroke-linecap="round"
            stroke-dasharray="1549 1822" transform="rotate(-90 512 550)" filter="url(#soft)" opacity=".7"/>
    <!-- tick marks -->
    <g stroke="#e9efe9" stroke-width="12" stroke-linecap="round" opacity=".9">
      <line x1="512" y1="300" x2="512" y2="334"/><line x1="762" y1="550" x2="728" y2="550"/>
      <line x1="512" y1="800" x2="512" y2="766"/><line x1="262" y1="550" x2="296" y2="550"/>
    </g>
    <!-- speed streaks -->
    <g stroke="#ffe04a" stroke-linecap="round" opacity=".85">
      <line x1="196" y1="640" x2="320" y2="604" stroke-width="18"/>
      <line x1="226" y1="706" x2="330" y2="676" stroke-width="14" opacity=".7"/>
      <line x1="270" y1="760" x2="350" y2="737" stroke-width="10" opacity=".5"/>
    </g>
    <!-- football -->
    <g transform="rotate(-32 520 545)">
      <ellipse cx="520" cy="545" rx="210" ry="128" fill="url(#ball)" stroke="#2a1003" stroke-width="12"/>
      <path d="M352 470 Q340 545 352 620" fill="none" stroke="#f4f1ea" stroke-width="18" stroke-linecap="round"/>
      <path d="M688 470 Q700 545 688 620" fill="none" stroke="#f4f1ea" stroke-width="18" stroke-linecap="round"/>
      <line x1="438" y1="545" x2="602" y2="545" stroke="#f4f1ea" stroke-width="16" stroke-linecap="round"/>
      <g stroke="#f4f1ea" stroke-width="13" stroke-linecap="round">
        <line x1="458" y1="520" x2="458" y2="570"/><line x1="490" y1="518" x2="490" y2="572"/>
        <line x1="520" y1="516" x2="520" y2="574"/><line x1="550" y1="518" x2="550" y2="572"/>
        <line x1="582" y1="520" x2="582" y2="570"/>
      </g>
      <ellipse cx="470" cy="482" rx="96" ry="26" fill="#ffffff" opacity=".13"/>
    </g>
  </g>
</svg>
