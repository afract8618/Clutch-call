<!doctype html>
<html lang="en" data-theme="broadcast">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clutch Call</title>
<meta name="description" content="Replay the most famous final drives in NFL history. Call every play, read the defense, manage the clock, and see if you can beat what really happened.">
<meta name="theme-color" content="#0f1b2d">
<meta property="og:title" content="Clutch Call: replay history's greatest final drives">
<meta property="og:description" content="One real final drive a day. Call the plays and see if you can beat what really happened.">
<meta property="og:image" content="icon-512.png">
<link rel="icon" type="image/png" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Clutch Call">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== THEMES ===== */
:root,[data-theme="broadcast"]{
  --bg:#e9edf3; --surface:#ffffff; --surface2:#f4f6fa; --line:#d8dee8; --text:#0f1b2d; --muted:#5b687c;
  --accent:#d61f3a; --accent2:#a8132a; --onaccent:#ffffff; --good:#14945a; --bad:#d61f3a; --warn:#dd8600; --info:#1d5fd1;
  --sb:#0f1b2d; --sb2:#1b2b44; --sbtext:#ffffff; --sbmuted:#9fb0c8; --clock:#ffd23f; --score:#ffffff;
  --grass1:#2f8c49; --grass2:#2a8143; --fline:#ffffffcc; --fline2:#ffffff55; --ezown:#1d5fd1; --ezopp:#d61f3a;
  --off:#1d5fd1; --offs:#ffffff; --def:#ffffff; --defs:#d61f3a; --los:#4aa3ff; --fd:#ffd23f; --ball:#7a3d17;
  --shadow:0 6px 18px #0f1b2d1f; --radius:14px; --page:linear-gradient(#dde3ec,#e9edf3 240px);
}
[data-theme="clean"]{
  --bg:#f6f5f0; --surface:#ffffff; --surface2:#f1f0ea; --line:#e2e0d6; --text:#141414; --muted:#6d6b63;
  --accent:#1f7a4c; --accent2:#155c38; --onaccent:#ffffff; --good:#1f7a4c; --bad:#c23b2b; --warn:#c98a00; --info:#2b5fae;
  --sb:#ffffff; --sb2:#f1f0ea; --sbtext:#141414; --sbmuted:#7c7a72; --clock:#141414; --score:#141414;
  --grass1:#3e9b5d; --grass2:#389155; --fline:#ffffffd9; --fline2:#ffffff5c; --ezown:#2b5fae; --ezopp:#c23b2b;
  --off:#141414; --offs:#ffffff; --def:#ffffff; --defs:#141414; --los:#5fb0ff; --fd:#ffd84a; --ball:#7a3d17;
  --shadow:0 4px 14px #0000000f; --radius:16px; --page:#f6f5f0;
}
[data-theme="retro"]{
  --bg:#f1e4c8; --surface:#fbf3e1; --surface2:#f5e9cf; --line:#dfcaa0; --text:#3b2415; --muted:#7f5f43;
  --accent:#d9601c; --accent2:#a8460f; --onaccent:#fff7ea; --good:#4f7a28; --bad:#b8321c; --warn:#d9901c; --info:#2f6b7a;
  --sb:#3b2415; --sb2:#4d3020; --sbtext:#fbf3e1; --sbmuted:#d4b98f; --clock:#ffb347; --score:#fbf3e1;
  --grass1:#6e8f3b; --grass2:#678636; --fline:#fbf3e1d0; --fline2:#fbf3e155; --ezown:#2f6b7a; --ezopp:#b8321c;
  --off:#d9601c; --offs:#fbf3e1; --def:#fbf3e1; --defs:#3b2415; --los:#7fc7d9; --fd:#ffd45a; --ball:#6b3412;
  --shadow:0 5px 0 #3b241522; --radius:10px; --page:repeating-linear-gradient(0deg,#f1e4c8 0 3px,#eedfc0 3px 6px);
}
[data-theme="midnight"]{
  --bg:#07100c; --surface:#122219; --surface2:#182c21; --line:#24402f; --text:#eef5ef; --muted:#93a99a;
  --accent:#ffb627; --accent2:#ff8a1f; --onaccent:#1d1100; --good:#3ddc84; --bad:#ff4d4d; --warn:#ffb627; --info:#5aa9ff;
  --sb:#0b0f0d; --sb2:#121a15; --sbtext:#eef5ef; --sbmuted:#93a99a; --clock:#ff5a3c; --score:#ffb627;
  --grass1:#1f6b3a; --grass2:#1b6034; --fline:#ffffffaa; --fline2:#ffffff3a; --ezown:#173b6b; --ezopp:#7a1d1d;
  --off:#ffb627; --offs:#1d1100; --def:#0b1510; --defs:#eef5ef; --los:#5aa9ff; --fd:#ffe04a; --ball:#8a3f15;
  --shadow:0 10px 30px #0008; --radius:14px; --page:radial-gradient(120% 60% at 50% -10%,#1d3a2a 0%,#07100c 60%);
}
[data-theme="neon"]{
  --bg:#07070d; --surface:#11111c; --surface2:#171726; --line:#26263d; --text:#f2f2ff; --muted:#8d8db0;
  --accent:#00e5ff; --accent2:#7c4dff; --onaccent:#00141a; --good:#2dff9b; --bad:#ff3d71; --warn:#ffd23f; --info:#00e5ff;
  --sb:#000000; --sb2:#0d0d18; --sbtext:#f2f2ff; --sbmuted:#8d8db0; --clock:#ff2bd6; --score:#00e5ff;
  --grass1:#0c1a14; --grass2:#0a1611; --fline:#00e5ff99; --fline2:#00e5ff2e; --ezown:#2b1a66; --ezopp:#5c0f3d;
  --off:#00e5ff; --offs:#00141a; --def:#ff2bd6; --defs:#2a0020; --los:#00e5ff; --fd:#ffd23f; --ball:#ffb347;
  --shadow:0 0 22px #00e5ff22; --radius:12px; --page:radial-gradient(100% 50% at 50% 0%,#1a1036 0%,#07070d 70%);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Barlow,system-ui,sans-serif}
body{background:var(--page) fixed;min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.num{font-family:Teko,Impact,"Arial Narrow",sans-serif}
.wrap{max-width:520px;margin:0 auto;padding:8px 12px 40px}

header{display:flex;align-items:center;gap:9px;padding:6px 0 10px}
.logo{width:36px;height:36px;border-radius:9px;flex:none}
.brand{font-family:Teko,Impact,sans-serif;font-size:25px;line-height:1;letter-spacing:.3px;font-weight:700;white-space:nowrap;min-width:0;overflow:hidden}
.brand small{display:block;overflow:hidden;text-overflow:ellipsis;font-family:Barlow,sans-serif;font-size:9.5px;letter-spacing:1.2px;color:var(--accent);font-weight:800;text-transform:uppercase}
.hbtns{margin-left:auto;display:flex;gap:4px;flex:none}
.ibtn{width:32px;height:32px;flex:none;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:16px;box-shadow:var(--shadow)}
.tabs{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:12px;box-shadow:var(--shadow)}
.tabs button{flex:1;padding:9px 0;border-radius:9px;font-weight:800;font-size:13px;color:var(--muted);letter-spacing:.8px}
.tabs button.on{background:var(--accent);color:var(--onaccent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.kick{font-size:11px;letter-spacing:1.8px;color:var(--accent);font-weight:800;text-transform:uppercase}
.intro h2{font-family:Teko,Impact,sans-serif;font-size:38px;line-height:.95;margin:6px 0 8px;font-weight:600}
.intro h2 em{font-style:normal;color:var(--muted);font-size:26px}
.intro p{margin:0 0 12px;line-height:1.45;color:var(--text);opacity:.88}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.facts div{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center}
.facts b{display:block;font-family:Teko,Impact,sans-serif;font-size:26px;line-height:1;color:var(--accent)}
.facts span{font-size:9.5px;letter-spacing:1px;color:var(--muted);font-weight:800}
.big{display:block;width:100%;padding:14px;border-radius:12px;background:var(--accent);color:var(--onaccent);font-weight:800;font-size:16px;letter-spacing:.6px;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 35%,transparent)}
.big:active{transform:scale(.98)}
.ghost{display:block;width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);font-weight:700;margin-top:8px;color:var(--muted);background:var(--surface)}
.teaser{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--surface2);border:1px dashed var(--line);font-size:13px;color:var(--muted)}

/* scoreboard */
.board{background:linear-gradient(var(--sb),var(--sb2));color:var(--sbtext);border-radius:var(--radius);padding:9px 12px 10px;box-shadow:var(--shadow);border:1px solid var(--line)}
.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.team{text-align:center;min-width:0}
.team .nm{font-size:11px;letter-spacing:1.6px;color:var(--sbmuted);font-weight:800;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team .sc{font-family:Teko,Impact,sans-serif;font-size:46px;line-height:.9;color:var(--score)}
.clock{font-family:Teko,Impact,sans-serif;font-size:52px;line-height:.85;color:var(--clock);font-variant-numeric:tabular-nums;text-align:center}
.clock.low{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.5}}
.cstate{display:flex;justify-content:center;align-items:center;gap:5px;font-size:9.5px;letter-spacing:1.4px;font-weight:800;color:var(--sbmuted);margin-top:2px}
.cstate i{width:7px;height:7px;border-radius:50%;background:var(--sbmuted)}
.cstate.run{color:var(--sbtext)}.cstate.run i{background:#ff4d3a;box-shadow:0 0 8px #ff4d3a;animation:pulse .8s infinite}
.sit{display:grid;grid-template-columns:1.1fr 1.2fr .9fr;margin-top:7px;padding-top:7px;border-top:1px solid color-mix(in srgb,var(--sbtext) 15%,transparent)}
.sit .lbl{display:block;font-size:9px;letter-spacing:1.4px;color:var(--sbmuted);font-weight:800}
.sit b{font-family:Teko,Impact,sans-serif;font-size:23px;line-height:1;font-weight:600;letter-spacing:.4px}
.tos{display:flex;gap:4px;margin-top:5px}
.tos i{width:14px;height:5px;border-radius:3px;background:color-mix(in srgb,var(--sbtext) 20%,transparent)}
.tos i.on{background:var(--clock)}
.drivebar{position:relative;height:8px;border-radius:8px;margin-top:8px;background:linear-gradient(90deg,var(--ezown) 0 8.3%,color-mix(in srgb,var(--sbtext) 18%,transparent) 8.3% 91.7%,var(--ezopp) 91.7%)}
.drivebar .done{position:absolute;top:0;bottom:0;border-radius:8px;background:color-mix(in srgb,var(--clock) 55%,transparent);transition:all .6s}
.drivebar .bl{position:absolute;top:-3px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--ball);border:2px solid var(--sbtext);transition:left .6s}
.drivebar .fdt{position:absolute;top:-2px;width:3px;height:12px;margin-left:-1.5px;background:var(--fd);transition:left .6s}

/* field */
.fieldwrap{position:relative;margin:10px 0;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line);background:var(--grass1)}
svg.field{display:block;width:100%;height:auto}
.pl circle{transition:none}
.fieldtag{position:absolute;left:8px;top:8px;background:#000a;color:#fff;font-size:11px;font-weight:800;letter-spacing:1px;padding:4px 8px;border-radius:20px;pointer-events:none}

.look{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--info);border-radius:12px;padding:9px 12px;margin-bottom:10px;box-shadow:var(--shadow)}
.look .k{font-size:10px;letter-spacing:1.8px;color:var(--info);font-weight:800}
.look .t{font-family:Teko,Impact,sans-serif;font-size:23px;line-height:1.05;margin-top:2px}
.look .d{font-size:13px;color:var(--muted);margin-top:1px}

.cats{display:flex;gap:5px;margin-bottom:7px}
.cats button{flex:1;padding:8px 0;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:800;font-size:12.5px;color:var(--muted);letter-spacing:.4px}
.cats button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.cues{display:flex;flex-wrap:wrap;gap:5px;margin:5px 0 4px}
.cues span{background:var(--surface2);border:1px solid var(--line);border-radius:20px;padding:3px 9px;font-size:12px;font-weight:700}
.wbox{display:flex;gap:4px}.wbox i{font-style:normal;width:26px;height:26px;border-radius:6px;display:grid;place-items:center;font-family:Teko,Impact,sans-serif;font-size:19px;font-weight:700}
.wbox .w{background:var(--good);color:#fff}.wbox .cur{border:2px solid var(--text)}
.sub2{font-weight:800;margin-top:6px}
.hero{font-family:Teko,Impact,sans-serif;font-size:58px;line-height:.85;font-weight:700;margin:8px 0 4px}
.hero small{display:block;font-size:26px;color:var(--muted);font-weight:600}
.matchup{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;margin:10px 0}
.matchup b{display:block;font-size:17px}.matchup span{font-size:10px;letter-spacing:1.5px;color:var(--accent);font-weight:800}
.msc{font-family:Teko,Impact,sans-serif;font-size:44px;font-weight:600}
.warnline{color:var(--bad);font-weight:800;font-size:12px;letter-spacing:.6px;text-align:center;margin-top:10px;text-transform:uppercase}
.legend{display:flex;align-items:center;gap:7px;margin:-2px 0 10px;font-size:12px}
.legend i{width:70px;height:7px;border-radius:7px;background:linear-gradient(90deg,hsl(0,72%,46%),hsl(55,72%,46%),hsl(125,72%,46%))}
.ratb{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 11px;font-weight:800;font-size:12.5px}
#lastplay .entry{margin-bottom:10px}
.callhead{display:flex;align-items:center;justify-content:space-between;margin:2px 0 8px}
.callhead b{font-family:Teko,Impact,sans-serif;font-size:26px;letter-spacing:.5px;text-transform:uppercase}
.back{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 12px;font-weight:800;font-size:13px}
.bigcalls{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.bigcalls button{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:18px 0;font-family:Teko,Impact,sans-serif;font-size:27px;font-weight:600;letter-spacing:.5px;box-shadow:var(--shadow)}
.bigcalls button:active{transform:scale(.96)}
.rows .row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.rows .row>span{flex:1;font-weight:800;font-size:15px}
.sb{display:flex;gap:5px}.sb button{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 11px;font-weight:800;font-size:12.5px;letter-spacing:.4px;box-shadow:var(--shadow)}
.sb button:active{transform:scale(.95)}
.tog{display:flex;align-items:center;width:100%;text-align:left;margin-top:10px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.tog span{flex:1}.tog b{display:block;font-size:14.5px}.tog small{color:var(--muted);font-size:12px}
.tog i{width:42px;height:24px;border-radius:24px;background:var(--line);position:relative;flex:none;transition:.2s}
.tog i:after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.tog.on i{background:var(--good)}.tog.on i:after{left:21px}
.small{font-size:12.5px;line-height:1.35;margin-bottom:8px}
.chips2{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:20px;padding:7px 12px;font-weight:800;font-size:13px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.rcv{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:8px;padding:9px 10px;margin-bottom:6px;border-radius:12px;background:var(--surface);border:1px solid var(--line);cursor:pointer;box-shadow:var(--shadow)}
.rcv:active{transform:scale(.98)}
.rcv .pos{font-family:Teko,Impact,sans-serif;font-size:20px;color:var(--muted)}
.rcv .who b{display:flex;align-items:center;gap:6px;font-size:15px}.rcv .who b i{width:9px;height:9px;border-radius:50%;flex:none}
.rcv .rt{margin-top:3px;border:1px dashed var(--line);border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700;color:var(--muted);background:var(--surface2)}
.rcv .od{text-align:right;font-size:12px;color:var(--muted);line-height:1.35}
.screenb{display:block;width:100%;margin-top:4px;padding:11px;border-radius:12px;background:var(--warn);color:#1d1300;font-weight:800;font-size:16px;letter-spacing:.5px}
.screenb small{display:block;font-weight:600;font-size:12px}
.tricks{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.tricks button{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:13px 8px;box-shadow:var(--shadow)}
.tricks b{display:block;font-family:Teko,Impact,sans-serif;font-size:23px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.tricks small{color:var(--muted);font-size:12px}
.pbp{margin-top:14px}.pbp summary{font-size:11px;letter-spacing:1.8px;color:var(--muted);font-weight:800;cursor:pointer;padding:6px 0}
.pbp .log{margin-top:6px}
.fb{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;box-shadow:var(--shadow)}
.fbh{font-family:Teko,Impact,sans-serif;font-size:26px;line-height:1;font-weight:600;letter-spacing:.4px}
.fbt{font-size:14px;margin:3px 0 4px}
.read{border-left:3px solid;padding:4px 8px;margin:6px 0;font-weight:700;font-size:13.5px}.read.good{border-color:var(--good)}.read.bad{border-color:var(--bad)}
.verdictline{font-size:14px;margin-top:4px}.verdictline.ok{color:var(--good)}
.opts{margin-top:6px}.opts summary{font-weight:800;font-size:13.5px;cursor:pointer;padding:6px 0}
.otab div{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px}.otab div.me{font-weight:800;color:var(--accent)}
.motionb{margin-top:7px;border:1px dashed var(--info);color:var(--info);background:none;border-radius:20px;padding:6px 11px;font-weight:800;font-size:12.5px}
.mread{margin-top:6px;font-weight:700;font-size:13px;color:var(--info)}
.dcalls{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.dcalls.two{grid-template-columns:1fr 1fr}
.dcalls button{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 4px;box-shadow:var(--shadow)}
.dcalls b{display:block;font-family:Teko,Impact,sans-serif;font-size:22px;line-height:1;font-weight:600}.dcalls small{color:var(--muted);font-size:11.5px}
.coord{display:block;width:100%;margin-top:8px;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:800}
.chcard{margin-top:10px;display:flex;gap:10px;align-items:center}.chcard>div{flex:1}.chcard b{display:block;font-size:16px}.chcard span{font-size:12.5px}.chcard .big{width:auto;padding:12px 16px;font-size:14px}
.pick{margin-bottom:6px}
.plays{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.play{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 9px 8px;text-align:left;display:flex;gap:8px;align-items:center;box-shadow:var(--shadow);transition:transform .08s,border-color .15s}
.play:active{transform:scale(.96)}
.play .em{font-size:22px;width:28px;text-align:center;flex:none}
.play .n{font-weight:800;font-size:14.5px;line-height:1.1}
.play .h{font-size:11.5px;color:var(--muted);line-height:1.2;margin-top:2px}
.utils{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px}
.util{flex:1 1 30%;min-width:96px;border-radius:12px;padding:9px 8px;font-weight:800;font-size:14px;text-align:center;border:1.5px solid;background:var(--surface)}
.util small{display:block;font-weight:600;font-size:11px;opacity:.8;margin-top:1px}
.u-to{color:var(--warn);border-color:var(--warn)}
.u-spike{color:var(--info);border-color:var(--info)}
.u-fg{color:var(--good);border-color:var(--good)}
.u-hail{color:var(--bad);border-color:var(--bad)}
.disabled{opacity:.35;pointer-events:none}
.locked .play,.locked .util{pointer-events:none;opacity:.55}

.logh{font-size:10px;letter-spacing:1.8px;color:var(--muted);font-weight:800;margin:16px 0 6px}
.log{display:flex;flex-direction:column;gap:6px}
.entry{display:flex;gap:9px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;animation:slide .35s ease}
.entry .tag{font-family:Teko,Impact,sans-serif;font-size:16px;line-height:1.25;color:var(--muted);min-width:46px}
.entry.good{border-left:3px solid var(--good)}.entry.bad{border-left:3px solid var(--bad)}
.entry.sys{background:none;border-style:dashed;color:var(--muted);font-size:13px}
@keyframes slide{from{opacity:0;transform:translateY(-6px)}}

.banner{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%) scale(.6);font-family:Teko,Impact,sans-serif;font-size:clamp(40px,13vw,64px);font-weight:700;letter-spacing:1px;white-space:nowrap;
  pointer-events:none;opacity:0;z-index:40;text-shadow:0 3px 0 #0009,0 0 26px #0006;transition:all .25s}
.banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

.mback{position:fixed;inset:0;background:#000a;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:50;display:none;align-items:flex-end;justify-content:center}
.mback.show{display:flex}
.modal{background:var(--bg);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:18px 16px calc(22px + env(safe-area-inset-bottom));animation:up .3s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.modal h3{font-family:Teko,Impact,sans-serif;font-size:34px;margin:0 0 6px;line-height:1;font-weight:600}
.modal .x{float:right;font-size:22px;color:var(--muted);padding:0 4px}
.res{text-align:center}
.res .verdict{font-family:Teko,Impact,sans-serif;font-size:60px;line-height:.9;font-weight:700}
.res .sub{color:var(--muted);margin:4px 0 10px}
.grid{font-size:22px;letter-spacing:2px;margin:6px 0 12px;word-break:break-all}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 12px;text-align:left}
.vs>div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.vs>.me{border:2px solid var(--accent)}
.vs .who{font-size:10px;letter-spacing:1.6px;color:var(--muted);font-weight:800}
.vs .what{font-family:Teko,Impact,sans-serif;font-size:26px;line-height:1.05}
.vs .how{font-size:12px;color:var(--muted);line-height:1.3}
.cmp{font-weight:800;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}
.stats div{text-align:center}
.stats b{display:block;font-family:Teko,Impact,sans-serif;font-size:32px;line-height:1}
.stats span{font-size:10px;color:var(--muted);letter-spacing:.4px}
.next{color:var(--muted);font-size:13px;margin-top:10px;text-align:center}
.next b{color:var(--text);font-family:Teko,Impact,sans-serif;font-size:22px;letter-spacing:1px}
.help li{margin-bottom:8px;line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips span{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:4px 9px;font-size:12px}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:30px;font-weight:700;z-index:60;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}
.streakbar{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:7px 12px;margin-bottom:10px;font-size:13px;box-shadow:var(--shadow)}
.streakbar b{font-family:Teko,Impact,sans-serif;font-size:24px;color:var(--accent);line-height:1}
.conf{position:fixed;top:-20px;font-size:22px;z-index:45;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* theme picker */
.themes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.th{border-radius:14px;border:2px solid var(--line);overflow:hidden;text-align:left;background:var(--surface)}
.th.on{border-color:var(--accent)}
.th .sw{height:64px;display:grid;grid-template-columns:2fr 1fr}
.th .sw div{display:grid;place-items:center}
.th .lab{padding:7px 10px;font-weight:800;font-size:14px}
.th .lab small{display:block;font-weight:500;color:var(--muted);font-size:11px}

/* leaderboard */
.lbtabs{display:flex;gap:6px;margin:6px 0 10px}
.lbtabs button{flex:1;padding:8px;border-radius:10px;border:1px solid var(--line);font-weight:800;font-size:13px;background:var(--surface);color:var(--muted)}
.lbtabs button.on{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.lbrow{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;background:var(--surface);border:1px solid var(--line);margin-bottom:5px}
.lbrow .rk{font-family:Teko,Impact,sans-serif;font-size:22px;color:var(--muted);text-align:center}
.lbrow .who{font-weight:800}
.lbrow .who small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.lbrow .pts{font-family:Teko,Impact,sans-serif;font-size:26px;color:var(--accent)}
.lbrow.me{border:2px solid var(--accent)}
.lbrow.top1 .rk{color:#e3a400}.lbrow.top2 .rk{color:#9aa5b1}.lbrow.top3 .rk{color:#c27a3a}
input.name{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-size:17px;font-weight:700;margin:8px 0 10px}
.muted{color:var(--muted)}
</style>
</head>

function cloneGame(g,seed){

function simPolicy(g){
  if(g.patPending)return g.time>60?"xp":"two";

  if(g.running&&g.to===0&&t<=25&&t>5&&g.down<4)return "spike";
  if(fgOK&&p>=.7&&(t<=8||g.down===4))return "fg";
  if(t<=7&&g.toGoal>22&&g.toGoal<=62)return "hail";
  if(g.down===4&&fgOK&&p>=.35)return "fg";
  if(g.togo<=2&&g.down>=3)return "run:keeper";
  if(t>90&&g.rng()<.25)return "run:inside:"+(g.leanShown==="L"?"R":"L");
  let best="X",bv=-1;

  return "pass:"+best;
}
function simValue(g,first,n,seed){
  let w=0;

    const c=cloneGame(g,seed+i*7919);
    if(first){if(!c.act(first)){return null}}
    let k=0;while(!c.over&&k++<60){if(!c.act(simPolicy(c)))c.act("run:inside:R")}
    if(c.result)w+=c.result.res==="win"?1:c.result.res==="tie"?.5:0;
  }
  return w/n;
}
function stateValue(g){
  if(g.over)return g.result.res==="win"?1:g.result.res==="tie"?.5:0;
  if(g.phase==="defense"){const lead=g.my-g.op,T=g.time,toG=100-g.d.yl,base=lead===0?.5:lead<=3?.42:lead<=6?.18:.08;
    const p=clamp(base*Math.min(1,T/95)*(1.3-toG/100)+(T>20?.03:0),0,.7);return lead===0?(1-p)*.5:1-p}

  for(const k of RECEIVERS)add(`pass:${k}`,`${ROUTES[g.routes[k]].n} to ${shortName(g.sc,k)}`);

  const x0=offSet()[k][0],s=SIDE[k],c=v=>clamp(v,1.5,FW-1.5);
  switch(name){
    case "slant":return [[ct*.35,x0,2],[ct,c(x0-s*6),d]];
    case "out":return [[ct*.65,x0,d],[ct,c(x0+s*4),d]];
    case "curl":return [[ct*.75,x0,d+2],[ct,x0-s*.8,d]];
    case "drag":return [[ct*.3,x0-s*2,1.5],[ct,c(x0-s*14),Math.max(d,2)]];
    case "screen":return [[ct*.6,35,-3.6],[ct,36.5,-2.2]];
    case "bubble":return [[ct,c(x0+s*2.5),-1.2]];
    case "comeback":return [[ct*.72,x0,d+3],[ct,c(x0+s*2.5),d]];
    case "dig":return [[ct*.55,x0,d],[ct,c(x0-s*10),d]];
    case "seam":return [[ct,x0,d]];
    case "corner":return [[ct*.5,x0,Math.max(4,d-6)],[ct,c(x0+s*8),d]];
    case "post":return [[ct*.5,x0,Math.max(4,d-8)],[ct,c(x0-s*9),d]];
    case "go":return [[ct,c(x0+s*1.5),d]];
    case "flat":return [[ct*.4,x0+s*2,1.2],[ct,c(x0+s*9),Math.max(1,d)]];
    case "cross":return [[ct*.35,x0-s*3,d*.6],[ct,c(x0-s*22),d]];
    case "angle":return [[ct*.45,x0+3,-2.5],[ct,x0-2,d]];
    case "wheel":return [[ct*.35,x0+5,-1.5],[ct*.6,c(x0+10),Math.min(d,6)],[ct,c(x0+11),d]];

const ROUTE_T={angle:[.42,.62],wheel:[.5,.78],slant:[.26,.46],bubble:[.24,.42],screen:[.42,.52],out:[.4,.6],curl:[.44,.64],drag:[.42,.62],flat:[.44,.64],comeback:[.46,.66],dig:[.46,.66],seam:[.46,.68],corner:[.5,.74],post:[.5,.74],cross:[.5,.74],go:[.5,.8]};
const QB_PATH={drop:[[.3,26.65,-7]],quick:[[.15,26.65,-6]],boot:[[.18,27.6,-5.2],[.5,36,-6.3],[.8,39,-5.5]],sprint:[[.35,35,-6.5],[.7,40,-5.5]],pa:[[.15,27.6,-5],[.45,26.65,-8.5]]};

/* Build an animation plan from the engine's last play. x = yards from left sideline, y = yards past the line of scrimmage. */
function planPlay(L){
  const o=offSet(),K={},add=(k,...pts)=>{K[k]=[[0,o[k][0],o[k][1]],...pts]};
  const kind=L.kind,play=L.play,yds=L.yards,toG=L.toGoal,S=L.spec||{};
  let dur=1900;
  const endY=kind==="td"?toG+2.5:yds;
  const block=pass=>{for(const k of ["LT","LG","C","RG","RT"])if(!K[k])add(k,[.35,o[k][0],o[k][1]+(pass?-1.6:1.4)],[1,o[k][0]+(pass?0:(Math.random()-.5)*2),o[k][1]+(pass?-1.2:2.4)])};
  const snap=(qx,qy,t1=.12)=>({t0:0,t1,fly:[[26.65,-1],[qx,qy]],h:.3});
  if(play==="spike"){dur=700;add("QB",[.15,26.65,-1.8],[1,26.65,-1.8]);block(true);
    return {K,ball:[snap(26.65,-1.8,.15),{t0:.15,t1:.4,fly:[[26.65,-1.8],[26.65,-1.2]],h:0}],carrier:null,dur,kind,play}}
  if(play==="fg"||kind==="fg"||kind==="fgmiss"){
    dur=1900;block(true);add("QB",[.2,25.8,-7],[1,25.8,-7]);add("RB",[.2,27.6,-7.4],[.35,26.9,-6.4],[1,27.2,-4]);
    const goalY=toG+10,tx=kind==="fg"?26.65+(Math.random()-.5)*2.5:26.65+L.side*(4.2+Math.random()*2);
    return {K,ball:[snap(25.8,-7,.18),{t0:.18,t1:.28,hold:"QB"},{t0:.28,t1:1,fly:[[25.8,-7],[tx,goalY]],h:14}],carrier:null,dur,kind,play,fg:true}}
  if(play==="hail"){
    dur=2600;block(true);const ez=toG+3,cp=[26.65+(Math.random()-.5)*3,ez];
    add("X",[.8,20,ez+1]);add("Z",[.8,33,ez]);add("SL",[.8,cp[0],cp[1]]);add("TE",[.8,29,ez-2]);add("RB",[.4,31,-4],[1,31,-4]);
    add("QB",[.3,26.65,-8],[1,27,-8.5]);
    return passFinish({K,kind,play,dur,endY,tgt:"SL",cp,throwT:.5,ct:.82,arc:7,L})}
  const fxFor=(base,spread=6)=>L.oob?(base>FW/2?FW+.6:-.6):clamp(base+(Math.random()-.5)*spread,4,FW-4);
  // ---- runs (built for the right side, mirrored for the left) ----
  if(S.type==="run"){
    dur=1800;block(false);const r=S.run,m=S.mirror,mx=x=>m?FW-x:x;
    let handT=.15,carrier="RB",ball;
    const fx=fxFor(mx(r==="toss"?45:r==="power"?30.5:r==="middle"?26.8:27.8));
    if(r==="keeper"){carrier="QB";handT=.1;add("RB",[.18,mx(25),-4],[.5,mx(21),-1],[1,mx(20),0]);
      add("QB",[.18,mx(27.5),-4.5],[.45,mx(31),-.8],[.7,mx(31.5),Math.min(endY,1.5)],[1,fx,endY]);
      ball=[snap(26.65,-5),{t0:.12,t1:1,hold:"QB"}]}
    else{
      if(r==="inside"||r==="middle"){const lx=r==="middle"?26.8:27.6;add("RB",[.15,mx(27.6),-4.6],[.42,mx(lx),-.5],[.65,mx(lx),Math.min(endY,1.5)],[1,fx,endY])}
      if(r==="power"){add("RB",[.15,mx(27.8),-4.6],[.42,mx(29.8),-.8],[.65,mx(30.5),Math.min(endY,1.5)],[1,fx,endY]);K.LG=[[0,mx(24.4),-1.2],[.28,mx(29),-2],[.55,mx(31),.8],[1,mx(32),2.5]]}
      if(r==="toss"){handT=.24;add("RB",[.2,mx(33),-6],[.45,mx(43.5),-3],[.7,mx(45.5),Math.min(endY,1)],[1,fx,endY])}
      add("QB",[.15,mx(27.2),-4.8],[.5,mx(23),-6.3],[1,mx(22),-6]);
      const q=kfPos(K.QB,.12);
      ball=r==="toss"?[snap(q[0],q[1]),{t0:.12,t1:handT,fly:[[q[0],q[1]],[mx(33),-6]],h:1}]:[snap(q[0],q[1]),{t0:.12,t1:handT,hold:"QB"}];
    }
    if(m)for(const k of OFF)if(K[k]&&!["RB","QB","LG"].includes(k))K[k]=K[k].map(p=>[p[0],p[1],p[2]]);
    runBlockers(K,o,add);
    if(kind==="fum")ball.push({t0:handT,t1:.82,hold:carrier},{t0:.82,t1:1,pop:true});else ball.push({t0:handT,t1:1,hold:carrier});
    return {K,ball,carrier,catchT:handT,dur,kind,play,endY,run:true}}
  // ---- trick runs ----
  if(S.type==="trick"&&(S.trick==="end"||S.trick==="direct")){
    dur=2000;block(false);let carrier,handT,ball;
    if(S.trick==="end"){carrier="Z";handT=.3;const fx=fxFor(7);
      K.Z=[[0,o.Z[0],o.Z[1]],[.3,29,-5.2],[.55,12,-3.5],[.75,7,Math.min(endY,1)],[1,fx,endY]];add("QB",[.15,27.2,-4.8],[.3,28.6,-5.2],[1,30,-6]);
      add("RB",[.2,31,-2],[1,34,1]);ball=[snap(26.65,-5),{t0:.12,t1:handT,hold:"QB"}]}
    else{carrier="RB";handT=.12;add("RB",[.15,30.8,-4.8],[.45,29.5,-.5],[.7,29.5,Math.min(endY,1.5)],[1,fxFor(29),endY]);add("QB",[.3,23.5,-6],[1,22.5,-6]);ball=[snap(31.2,-5.4)]}
    runBlockers(K,o,add);
    if(kind==="fum")ball.push({t0:handT,t1:.82,hold:carrier},{t0:.82,t1:1,pop:true});else ball.push({t0:handT,t1:1,hold:carrier});
    return {K,ball,carrier,catchT:handT,dur,kind,play,endY,run:true}}
  // ---- passes ----
  const routes=S.routes||DEF_ROUTES,tgt=S.tgt,rt=S.route||routes[tgt];
  let qb=S.qb||"drop",thrower="QB",base=null,throwT,ct;
  [throwT,ct]=ROUTE_T[rt]||[.44,.64];
  if(qb==="pa"||qb==="boot"||qb==="sprint"){throwT=Math.min(.82,throwT+.1);ct=Math.min(.92,ct+.1)}
  dur=rt==="go"?2500:ct>=.72?2300:ct>=.6?2000:1650;if(qb!=="drop"&&qb!=="quick")dur+=200;
  const comp=kind==="comp"||kind==="td",dep=S.depth!=null?S.depth:(ROUTES[rt]?ROUTES[rt].d:10);
  const d=comp?(dep<=0?dep:Math.max(1,Math.min(endY,dep,toG+1.5))):Math.min(Math.max(dep,2),toG+2);
  if(S.type==="trick"&&S.trick==="flea"){
    throwT=.62;ct=.88;dur=2700;qb="pa";
    add("RB",[.15,27.6,-4.6],[.3,27.4,-1.6],[.42,27.6,-2.2],[1,27,-1]);add("QB",[.15,27.2,-4.8],[.38,26.65,-7],[1,26.65,-7.5]);
    base=[snap(26.65,-5),{t0:.12,t1:.15,hold:"QB"},{t0:.15,t1:.3,hold:"RB"},{t0:.3,t1:.4,fly:[[27.4,-1.6],[26.65,-7]],h:1},{t0:.4,t1:throwT,hold:"QB"}];
  }else if(S.type==="trick"&&S.trick==="wrpass"){
    throwT=.6;ct=.88;dur=2700;thrower="Z";
    K.Z=[[0,o.Z[0],o.Z[1]],[.25,44,-4],[.6,42.5,-6],[1,42,-6]];add("QB",[.25,27,-5.5],[1,28,-6]);
    base=[snap(26.65,-5),{t0:.12,t1:.15,hold:"QB"},{t0:.15,t1:.25,fly:[[26.65,-5],[44,-4]],h:.8},{t0:.25,t1:throwT,hold:"Z"}];
  }else add("QB",...QB_PATH[qb],[1,...QB_PATH[qb][QB_PATH[qb].length-1].slice(1)]);
  block(qb!=="boot"&&qb!=="pa");
  if((qb==="pa"||qb==="boot"||S.rpo)&&tgt!=="RB"&&!K.RB)add("RB",[.18,27.3,-4.2],[.45,24.5,.4],[1,24,.8]);
  const pts=routePts(rt,tgt,d,ct);if(!K[tgt])add(tgt,...pts);else K[tgt].push(...pts.filter(p=>p[0]>K[tgt][K[tgt].length-1][0]));
  const cp=[pts[pts.length-1][1],pts[pts.length-1][2]];
  if(rt==="screen"){K.LG=[[0,24.4,-1.2],[.4,29,-1],[1,35,3]];K.RG=[[0,28.9,-1.2],[.4,33,-1],[1,38,4]]}
  for(const k of RECEIVERS)if(!K[k]){const rk=routes[k];add(k,...routePts(rk,k,ROUTES[rk]?ROUTES[rk].d:8,1))}
  const arc=d<8?1.6:d<16?3:6;
  if(kind==="sack"){const mv=qb==="boot"||qb==="sprint",who=thrower,start=kfPos(K[who],.2);
    K[who]=[[0,o[who][0],o[who][1]],[.2,start[0],start[1]],[.35,mv?32:start[0],mv?-6.5:Math.min(start[1],-7)],[1,mv?33:start[0]-.8,yds]];
    return {K,ball:base?base.filter(s=>s.t0<.3).concat([{t0:.3,t1:1,hold:who}]):[snap(26.65,-5),{t0:.12,t1:1,hold:"QB"}],carrier:who,catchT:.55,dur:1600,kind,play,endY:yds,sack:true,pa:qb==="pa"||qb==="boot"}}
  return passFinish({K,kind,play,dur,endY,tgt,cp,throwT,ct,arc,qb,L,thrower,base});
}
function runBlockers(K,o,add){
  const R2={X:[[.5,5.5,4],[1,6,7]],Z:[[.5,47.5,4],[1,46,7]],SL:[[.5,38.5,3],[1,37,5]],TE:[[.35,33,.5],[1,32,2]]};
  for(const k in R2)if(!K[k])add(k,...R2[k]);
}
function passFinish({K,kind,play,dur,endY,tgt,cp,throwT,ct,arc,qb,L,thrower="QB",base=null}){
  const qAt=kfPos(K[thrower],throwT);
  base=base||[{t0:0,t1:.12,fly:[[26.65,-1],[26.65,-5]],h:.3},{t0:.12,t1:throwT,hold:thrower}];
  const pa=qb==="pa"||qb==="boot";
  if(kind==="comp"||kind==="td"){
    const k=K[tgt],last=k[k.length-1];
    const fx=L.oob?(cp[0]>FW/2?FW+.6:-.6):clamp(cp[0]+(Math.random()-.5)*6,3,FW-3);
    if(endY>last[2]+.3||L.oob)k.push([1,fx,Math.max(endY,last[2])]);else k.push([1,last[1],last[2]]);
    return {K,ball:[...base,{t0:throwT,t1:ct,fly:[qAt,cp],h:arc},{t0:ct,t1:1,hold:tgt}],carrier:tgt,catchT:ct,throwT,landing:cp,dur,kind,play,endY,target:tgt,pa}}
  const miss=kind==="int"?[cp[0]+.6,cp[1]+.8]:[cp[0]+(Math.random()-.5)*3,cp[1]+2.5];
  const ball=[...base,{t0:throwT,t1:ct,fly:[qAt,miss],h:arc}];
  if(kind==="int")ball.push({t0:ct,t1:1,hold:"_picker"});else ball.push({t0:ct,t1:1,fly:[miss,[miss[0]+.8,miss[1]+1.2]],h:0});
  return {K,ball,carrier:null,catchT:ct,throwT,dur,kind,play,landing:miss,picker:kind==="int",target:tgt,pa}
}

function animatePlay(L,done){
  const los=L.los,plan=planPlay(L),ds=defSet(L.shown||L.look),dz=defSet(L.look),t0=performance.now(),dur=plan.dur;
  setFormation(los,L.shown||L.look);
  const D={};for(const k of DEF)D[k]={x:ds[k][0],y:ds[k][1]};
  const role=k=>k.startsWith("D")?"dl":k.startsWith("L")?"lb":"db";
  const spd={dl:7,lb:9.5,db:10.5};
  const man=L.look==="blitz"||L.look==="press";
  const cover={CB1:"X",CB2:"Z",S2:man?"SL":null,LB3:man?"TE":null};
  let pickerK=null,last=t0;
  const offPos=(k,t)=>plan.K[k]?kfPos(plan.K[k],t):offSet()[k];
  function ballAt(t){
    for(const s of plan.ball){if(t<s.t0||t>s.t1)continue;const k=(t-s.t0)/((s.t1-s.t0)||1);
      if(s.hold){const who=s.hold==="_picker"?pickerK:s.hold;if(!who)continue;const p=who in D?[D[who].x,D[who].y]:offPos(who,t);return {x:p[0],y:p[1]+.3,h:0}}
      if(s.pop){const c=offPos(plan.carrier,s.t0);return {x:c[0]+k*2.5,y:c[1]+k*1.5,h:Math.sin(k*Math.PI)*1.5}}
      if(s.fly){const [a,b]=s.fly;return {x:lerp(a[0],b[0],k),y:lerp(a[1],b[1],k),h:(s.h||0)*Math.sin(k*Math.PI)}}}
    const z=plan.ball[plan.ball.length-1];if(z.fly)return {x:z.fly[1][0],y:z.fly[1][1],h:0};if(z.pop){const c=offPos(plan.carrier,z.t0);return {x:c[0]+2.5,y:c[1]+1.5,h:0}}return {x:26.65,y:-1,h:0};
  }
  $("#hl").setAttribute("opacity",0);
  playAnim=now=>{
    const t=clamp((now-t0)/dur,0,1),dt=Math.min(.05,(now-last)/1000)*(1900/dur)*1.15;last=now;
    for(const k of OFF){const p=offPos(k,t);placeP(k,p[0],los+p[1])}
    const b=ballAt(t);
    let target=null,phase="cover";
    if(plan.carrier&&t>(plan.catchT||.15)){const c=offPos(plan.carrier,t);target={x:c[0],y:c[1]};phase="chase"}
    else if(plan.landing&&plan.throwT&&t>=plan.throwT){target={x:plan.landing[0],y:plan.landing[1]};phase="ball"}
    if(plan.picker&&!pickerK&&t>.3){let best=null,bd=1e9;for(const k of DEF){if(role(k)==="dl")continue;const dd=Math.hypot(D[k].x-plan.landing[0],D[k].y-plan.landing[1]);if(dd<bd){bd=dd;best=k}}pickerK=best}
    for(const k of DEF){
      const r=role(k),p=D[k];let tx,ty;
      if(k===pickerK&&t<plan.catchT){tx=plan.landing[0];ty=plan.landing[1];const s=(spd.db+6)*dt*2.2,dx=tx-p.x,dy=ty-p.y,dd=Math.hypot(dx,dy);if(dd>.05){p.x+=dx/dd*Math.min(s,dd);p.y+=dy/dd*Math.min(s,dd)}placeP(k,p.x,los+p.y);continue}
      if(k===pickerK&&t>=plan.catchT){p.y-=dt*8;p.x+=(p.x<FW/2?1:-1)*dt*2;placeP(k,p.x,los+p.y);continue}
      let stop=0;
      if(plan.fg){tx=p.x;ty=r==="dl"?-1:p.y}
      else if(phase==="chase"){tx=target.x;ty=target.y;stop=R*1.7}
      else if(phase==="ball"&&(r!=="dl"||Math.hypot(target.x-p.x,target.y-p.y)<12)){tx=target.x;ty=target.y;stop=plan.picker?0:R*1.6}
      else if(plan.pa&&r==="lb"&&t<.38){tx=p.x;ty=.8}                      // linebackers bite on the fake
      else if(r==="dl"||(L.look==="blitz"&&r==="lb")){const q=offPos("QB",t),thru=plan.sack&&(k==="DE1"||k==="DT2"||k==="LB2");tx=thru?q[0]:lerp(p.x,q[0],.3);ty=thru?q[1]+.3:Math.max(q[1]+.3,-.2);stop=thru?R*1.2:0}
      else if(cover[k]&&plan.K[cover[k]]){const q=offPos(cover[k],t),soft=!man;tx=q[0]+(q[0]<FW/2?.9:-.9);ty=q[1]+(soft?3:1.3)}
      else if(r==="db"){tx=dz[k][0]+(dz[k][0]<FW/2?-1:1);ty=dz[k][1]+(L.look==="soft"||L.look==="two"?4:2.5)}
      else{tx=dz[k][0];ty=dz[k][1]+(plan.run?-1.5:2.5)}
      const s=spd[r]*dt*(phase==="cover"?.85:1.25),dx=tx-p.x,dy=ty-p.y,dd=Math.hypot(dx,dy);
      if(dd>stop+.05){const m=Math.min(s,dd-stop);p.x+=dx/dd*m;p.y+=dy/dd*m}
      placeP(k,p.x,los+p.y);
    }
    placeBall(b.x,los+b.y,b.h||0);
    if(plan.carrier&&t>(plan.catchT||.15)){const c=offPos(plan.carrier,t),hl=$("#hl"),[sx,sy]=W2S(c[0],los+c[1]);hl.setAttribute("opacity",.9);hl.setAttribute("cx",sx);hl.setAttribute("cy",sy)}
    const want=clamp(Math.max(camFor(los),los+b.y-VH+9),-10,110-VH);
    if(Math.abs(want-cam)>.05)setCam(lerp(cam,want,.12));
    if(t>=1){setTimeout(done,plan.fg?450:320);return false}
    return true;
  };
  kick();
}

/* ================= DAILY / SURVIVOR ================= */
const EPOCH=Date.UTC(2026,9,15);
function today(){const d=new Date();return Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-EPOCH)/864e5)+1}
function shuffled(arr,seed){const r=mulberry32(seed),a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function dailyDrive(n){const L=DRIVES.length,cyc=Math.floor((n-1)/L);return shuffled(DRIVES,hashStr("cyc"+cyc))[((n-1)%L+L)%L]}
function survivorDrive(level,order){
  if(level<order.length)return order[level];
  const r=Math.random,hard=Math.min(level-order.length+4,12),deficit=[3,4,6,3,4,6,1,2][Math.floor(r()*8)],my=7*Math.floor(r()*4)+3*Math.floor(r()*3);
  return {id:"gen"+level,game:`Bonus drive`,date:"",team:"You",opp:FAKE_OPP[Math.floor(r()*FAKE_OPP.length)],my,op:my+deficit,w:["clear","dome","wind","rain","snow","cold"][Math.floor(r()*6)],lk:LATE,
    t:clamp(150-hard*9-Math.floor(r()*30),20,160),yl:clamp(35-hard*2-Math.floor(r()*18),2,60),to:clamp(3-Math.floor(hard/3)-(r()<.3?1:0),0,3),real:null};
}

function needText(sc){const d=sc.op-sc.my;if(d===0)return "A field goal wins it.";if(d<=2)return "A field goal wins it.";if(d===3)return "A field goal ties it, a touchdown wins it.";return d===7?"You need a touchdown just to tie.":"You need a touchdown."}
function sitLine(sc){return `${sc.op===sc.my?"Tied":"Down "+(sc.op-sc.my)} · ${fmtClock(sc.t)} · ${spot(sc.yl)} · ${sc.to} TO`}
function scLabel(sc){return sc.real?`${sc.game} · ${sc.team} vs ${sc.opp}`:`${sc.game} vs ${sc.opp}`}

function introCard(sc,kick,btns){
  const ball=sc.yl<50?"OWN "+sc.yl:sc.yl===50?"50":"OPP "+(100-sc.yl);
  return `<div class="card intro"><div class="kick">${kick}</div>
    <div class="sub2">${esc(sc.game)}${sc.date?" · "+esc(sc.date):""}</div>
    <div class="hero">${sc.op===sc.my?"TIED UP":"DOWN BY "+(sc.op-sc.my)}<small>${fmtClock(sc.t)} LEFT IN THE GAME</small></div>
    <div class="matchup"><div><b>${esc(sc.team)}</b><span>YOU</span></div><div class="msc">${sc.my}–${sc.op}</div><div><b>${esc(sc.opp)}</b><span>&nbsp;</span></div></div>
    <p>Ball on your ${sc.yl<50?sc.yl:"opponent's "+(100-sc.yl)}, ${sc.to} timeout${sc.to===1?"":"s"}. ${needText(sc)}${COACH[sc.id]?` You're calling it for the ${esc(sc.team)}. <b>Can you do better than ${COACH[sc.id]} did?</b>`:""}</p>
    <div class="facts"><div><b>${fmtClock(sc.t)}</b><span>CLOCK</span></div><div><b>${ball}</b><span>BALL</span></div>
    <div><b>${sc.to}</b><span>TIMEOUTS</span></div><div><b>${sc.op===sc.my?"TIE":"-"+(sc.op-sc.my)}</b><span>SCORE</span></div></div>${btns}
    ${sc.real?`<div class="teaser">📜 <span>This really happened. Finish the drive, then see how it actually ended.</span></div>`:""}</div>`;
}
function survIntro(level,order,hist){
  game=null;const sc=survivorDrive(level,order);
  $("#main").innerHTML=`<div class="streakbar"><div class="wbox">${hist.map(()=>`<i class="w">W</i>`).join("")}<i class="cur">${hist.length+1}</i></div><span>Best ${store.get("survBest",0)}</span></div>`+
    introCard(sc,`Survivor · Game ${level+1} · ${WEATHER[sc.w].label}`,`<button class="big" id="go">PLAY</button><div class="warnline">Win to stay alive. Lose and your run is over. Tied at the end counts as a loss.</div>`);
  $("#go").onclick=()=>start(sc,{surv:true,level,order,hist,seed:(Math.random()*4e9)>>>0});
  window.scrollTo({top:0,behavior:"smooth"});
}
function renderHome(){
  game=null;const m=$("#main");
  if(mode==="daily"){
    const sc=dailyDrive(N),done=store.get("d"+N,null);
    m.innerHTML=introCard(sc,`Drive #${N} · ${WEATHER[sc.w].label}`,
      done?`<button class="big" id="go">SEE TODAY'S RESULT</button><button class="ghost" id="prac">Replay for practice (won't count)</button>`:`<button class="big" id="go">TAKE THE FIELD</button>`);
    $("#go").onclick=()=>done?showResult(done):start(sc,{daily:true,seed:hashStr("day"+N)});
    if(done)$("#prac").onclick=()=>start(sc,{practice:true,seed:(Math.random()*4e9)>>>0});
    m.insertAdjacentHTML("beforeend",`<div class="card chcard"><div><b>⚔️ 1v1 a friend</b><span class="muted">Play any drive, send the link, same luck for both of you.</span></div><button class="big" id="chb">CHALLENGE</button></div>`);
    $("#chb").onclick=showChallengePicker;
  }else{
    const best=store.get("survBest",0);
    m.innerHTML=`<div class="card intro"><div class="kick">Survivor mode</div><h2>How many in a row?</h2>
      <p>Every famous final drive, back to back in random order. Win to move on. One loss and the run is over. Clear them all and bonus drives keep getting nastier.</p>
      <div class="facts"><div><b>${best}</b><span>YOUR BEST</span></div><div><b>${DRIVES.length}</b><span>REAL DRIVES</span></div><div><b>1</b><span>LIFE</span></div><div><b>🏆</b><span>RANKED</span></div></div>
      <button class="big" id="go">START A RUN</button><button class="ghost" id="lbs">See the leaderboard</button></div>`;
    $("#go").onclick=()=>{const order=shuffled(DRIVES,(Math.random()*4e9)>>>0);survIntro(0,order,[])};
    $("#lbs").onclick=()=>showLeaderboard("survivor");
  }
}

function start(sc,opts){
  ctx={sc,...opts};game=new Game(sc,opts.seed);menu=null;feedback=null;coordRunning=false;
  const hist=opts.hist||[];
  $("#main").innerHTML=`
    ${opts.surv?`<div class="streakbar"><div class="wbox">${hist.map(()=>`<i class="w">W</i>`).join("")}<i class="cur">${hist.length+1}</i></div><span>Best ${store.get("survBest",0)}</span></div>`:""}
    <div class="board">
      <div class="teams">
        <div class="team"><div class="nm">${esc(sc.team)} · YOU</div><div class="sc" id="sMy"></div></div>
        <div><div class="clock" id="clk"></div><div class="cstate" id="cst"><i></i><span></span></div></div>
        <div class="team"><div class="nm">${esc(sc.opp)}</div><div class="sc" id="sOp"></div></div>
      </div>
      <div class="sit"><div><span class="lbl">DOWN</span><b id="dd"></b></div><div><span class="lbl">BALL ON</span><b id="bo"></b></div><div><span class="lbl">TIMEOUTS</span><div class="tos" id="tos"></div></div></div>
      <div class="drivebar"><div class="done" id="dbd"></div><div class="fdt" id="dbf"></div><div class="bl" id="dbb"></div></div>
    </div>
    <div class="fieldwrap">${fieldSVG()}<div class="fieldtag" id="ftag">${esc(sc.real?sc.game:"Survivor")}</div></div>
    <div class="legend"><span class="muted">worse</span><i></i><span class="muted">better</span><button class="ratb" id="ratb">🔎 Player ratings</button></div>
    <div class="look" id="look"></div>
    <div id="lastplay"></div>
    <div id="callz"></div>
    <details class="pbp" id="pbp"><summary>PLAY-BY-PLAY · ${WEATHER[sc.w].label}</summary><div class="log" id="log"></div></details>`;
  $("#main").onclick=onMainClick;
  $("#ratb").onclick=showRatings;
  game.push("KICK",`${scLabel(sc)}. ${needText(sc)}`,"sys");
  buildPlayers(ROSTERS[sc.id]);setCam(camFor(sc.yl));setFormation(sc.yl,game.shown);setLines(sc.yl,sc.yl+game.togo);
  $("#players").onclick=e=>{const p=e.target.closest("[data-k]");if(!p||busy||!game||game.over)return;const k=p.dataset.k;if(!RECEIVERS.includes(k))return;if(menu!=="pass"){menu="pass"}cycleRoute(k)};
  render();window.scrollTo({top:0,behavior:"smooth"});
}
let menu=null;
function onMainClick(e){
  if(!game)return;
  const cd=e.target.closest("[data-coord]");if(cd){if(busy||coordRunning)return;coordRunning=true;drawCalls();coordStep();return}
  const m=e.target.closest("[data-menu]");if(m){if(busy)return;menu=m.dataset.menu||null;drawCalls();drawRoutes();return}
  const md=e.target.closest("[data-mod]");if(md){const k=md.dataset.mod;game.mods[k]=!game.mods[k];drawCalls();return}
  const rt=e.target.closest("[data-route]");if(rt){e.stopPropagation();cycleRoute(rt.dataset.route);return}
  const b=e.target.closest("[data-a]");if(b&&!b.classList.contains("disabled"))doAct(b.dataset.a);
}
function cycleRoute(k){const set=ROUTE_SETS[k],i=set.indexOf(game.routes[k]);game.routes[k]=set[(i+1)%set.length];drawCalls();drawRoutes()}
const rcolor=r=>`hsl(${Math.round(clamp((r-62)/33,0,1)*125)},72%,46%)`;
function drawRoutes(){
  const t=$("#trails");if(!t||!game)return;
  if(menu!=="pass"||busy||game.over){t.innerHTML="";return}
  const los=game.yl,o=offSet();let h="";
  for(const k of RECEIVERS){const rk=game.routes[k],d=Math.min(ROUTES[rk].d,game.toGoal+2),pts=[[0,o[k][0],o[k][1]],...routePts(rk,k,d,1)];
    const P=pts.map(p=>W2S(p[1],los+p[2]).map(v=>v.toFixed(1)).join(",")).join(" "),z=pts[pts.length-1],[ex,ey]=W2S(z[1],los+z[2]);
    h+=`<polyline points="${P}" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round"/><circle cx="${ex}" cy="${ey}" r="5" fill="#fff"/>`}
  t.innerHTML=h;
}
function drawCalls(){
  const g=game,el=$("#callz");if(!g||!el)return;
  if(g.over){el.innerHTML="";return}
  const chip=(k,l)=>`<button class="chip ${g.mods[k]?"on":""}" data-mod="${k}">${l}</button>`;
  const tog=(k,l,d)=>`<button class="tog ${g.mods[k]?"on":""}" data-mod="${k}"><span><b>${l}</b><small>${d}</small></span><i></i></button>`;
  let h="";
  if(g.phase==="defense"){
    const D=g.d;
    el.innerHTML=`<div class="callhead"><b>Your defense</b><span class="muted">${esc(g.sc.opp)} ball · ${ord(Math.min(D.down,4))} & ${D.togo}</span></div>
      <div class="dcalls"><button data-a="d:blitz"><b>BLITZ</b><small>Send extra rushers</small></button><button data-a="d:box"><b>LOAD THE BOX</b><small>Stop the run</small></button><button data-a="d:soft"><b>PLAY IT SOFT</b><small>Keep it in front</small></button></div>
      <button class="coord" data-coord="1">${coordRunning?"Coordinator is calling it…":"Let the coordinator call this drive"}</button>
      ${g.canTimeout()?`<div class="utils"><button class="util u-to" data-a="timeout">⏱ Timeout<small>${g.to} left · stops clock</small></button></div>`:""}`;return}
  if(g.phase==="onside"){el.innerHTML=`<div class="callhead"><b>Kickoff</b></div><div class="dcalls two"><button data-a="onside"><b>ONSIDE KICK</b><small>About 1 in 8 recovered</small></button><button data-a="deep"><b>KICK IT DEEP</b><small>Make them punt it back</small></button></div>`;return}
  if(g.patPending){el.innerHTML=`<div class="callhead"><b>Extra point</b></div><div class="utils"><button class="util u-fg" data-a="two">✌️ Go for two<small>win it now</small></button><button class="util u-to" data-a="xp">🦶 Extra point<small>tie, go to OT</small></button></div>`;return}
  const titles={run:"Run",pass:"Pass",rpo:"RPO",trick:"Trick"};
  h+=`<div class="callhead"><b>${menu?titles[menu]:"Your call"}</b>${menu?`<button class="back" data-menu="">◀ Back</button>`:`<span class="muted">${ord(g.down)} & ${g.toGoal<=g.togo?"Goal":g.togo} · ${spot(g.yl)}</span>`}</div>`;
  if(!menu)h+=`<div class="bigcalls">${["run","pass","rpo","trick"].map(k=>`<button data-menu="${k}">${k==="rpo"?"RPO":k.toUpperCase()}</button>`).join("")}</div>`;
  else if(menu==="run"){
    const sides=k=>`<div class="sb"><button data-a="run:${k}:L">← LEFT</button><button data-a="run:${k}:R">RIGHT →</button></div>`;
    h+=`<div class="rows">${["outside","offtackle","inside"].map(k=>`<div class="row"><span>${RUNS[k].n}</span>${sides(k)}</div>`).join("")}
      ${["middle","keeper"].map(k=>`<div class="row"><span>${RUNS[k].n}</span><div class="sb"><button data-a="run:${k}">CALL IT</button></div></div>`).join("")}</div>
      ${tog("oob","Get out of bounds","The ball carrier tries to stop the clock. No guarantee.")}`;
  }else if(menu==="pass"){
    h+=`<div class="muted small"><b>Hot routes:</b> tap a route (or the player on the field) to change it. Tap a name to throw to him. Odds are based on what the defense is showing.</div>
      <div class="chips2">${chip("pa","Play action")}${chip("roll","Roll out")}${chip("oob","Out of bounds")}</div>`;
    h+=RECEIVERS.map(k=>{const o=passOdds(g,k,g.shown,g.mods),rt=ROUTES[g.routes[k]],rat=ratingOf(g.sc,k);
      return `<div class="rcv" data-a="pass:${k}"><span class="pos">${POSL[k]}</span><span class="who"><b><i style="background:${rcolor(rat)}"></i>${esc(shortName(g.sc,k))}</b><button class="rt" data-route="${k}">${rt.n} ▾</button></span>
        <span class="od">${Math.round(o.caught*100)}% caught · ${(o.caught*o.yds).toFixed(1)} yds a throw${o.picked>=.015?`<br>${Math.round(o.picked*100)}% picked`:""}</span></div>`}).join("");
    h+=`<button class="screenb" data-a="pass:screen">SCREEN<small>To the back, blockers in front</small></button>`;
  }else if(menu==="rpo"){
    h+=`<div class="muted small">Your QB reads it after the snap: hands off against a light box, pulls it and throws against a loaded box or blitz.</div>
      <div class="rows"><div class="row"><span>Run-pass option</span><div class="sb"><button data-a="rpo:L">← LEFT</button><button data-a="rpo:R">RIGHT →</button></div></div></div>`;
  }else if(menu==="trick"){
    h+=`<div class="muted small">Each trick play only works once per drive.</div><div class="tricks">${Object.entries(TRICKS).map(([k,t])=>`<button class="${g.tricksUsed[k]?"disabled":""}" data-a="trick:${k}"><b>${t.n}</b><small>${g.tricksUsed[k]?"Already used":t.d}</small></button>`).join("")}</div>
      ${tog("oob","Get out of bounds","The ball carrier tries to stop the clock.")}`;
  }
  let u="";
  if(g.canTimeout())u+=`<button class="util u-to" data-a="timeout">⏱ Timeout<small>${g.to} left · stops clock</small></button>`;
  if(g.canSpike())u+=`<button class="util u-spike" data-a="spike">⏸️ Spike<small>costs a down · ~4 sec</small></button>`;
  if(g.fgDist<=67){const p=Math.round(g.fgP*100);u+=`<button class="util u-fg" data-a="fg">🦶 Field Goal<small>${g.fgDist} yds · ${p}%${g.need>3?" · not enough":""}</small></button>`}
  if(g.time<=30&&g.toGoal>=20&&g.toGoal<=65)u+=`<button class="util u-hail" data-a="hail">🙏 Hail Mary<small>low odds · ends it</small></button>`;
  if(u)h+=`<div class="utils">${u}</div>`;
  el.innerHTML=h;
}
function render(){
  const g=game;
  $("#sMy").textContent=g.my;$("#sOp").textContent=g.op;
  const c=$("#clk");c.textContent=fmtClock(g.time);c.classList.toggle("low",g.time<=15&&!g.over);
  const cs=$("#cst");cs.classList.toggle("run",g.running);cs.lastChild.textContent=g.over?"FINAL":g.running?"CLOCK RUNNING":"CLOCK STOPPED";
  if(g.phase==="defense"){const D=g.d,Y=100-D.yl;$("#dd").textContent=`${ord(Math.min(D.down,4))} & ${100-D.yl<=D.togo?"Goal":D.togo}`;$("#bo").textContent=`THEM · ${Y<50?"YOUR "+Y:Y===50?"50":"THEIR "+(100-Y)}`}
  else{$("#dd").textContent=g.over||g.phase?"--":`${ord(Math.min(g.down,4))} & ${g.toGoal<=g.togo?"Goal":g.togo}`;
  $("#bo").textContent=g.yl>=100?"END ZONE":spot(clamp(g.yl,1,99)).toUpperCase()}
  $("#tos").innerHTML=[0,1,2].map(i=>`<i class="${i<g.to?"on":""}"></i>`).join("");
  const pct=y=>(8.33+clamp(y,0,100)*.8334)+"%";
  $("#dbb").style.left=pct(g.yl);$("#dbf").style.left=pct(Math.min(100,g.yl+g.togo));$("#dbf").style.opacity=g.over?0:1;
  $("#dbd").style.left=pct(g.startYl);$("#dbd").style.width=(Math.max(0,clamp(g.yl,0,100)-g.startYl)*.8334)+"%";
  const L=LOOKS[g.shown];
  if(g.over)$("#look").innerHTML=`<div class="k">FINAL</div><div class="t">${g.result.why}</div>`;
  else if(g.phase==="defense"){const lead=g.my-g.op;$("#look").innerHTML=`<div class="k">YOU'RE ON DEFENSE</div><div class="t">${lead===0?"Tied up":"Up by "+lead}. Get a stop.</div><div class="d">The ${esc(g.sc.opp)} need ${lead===0?"any score":lead<=2?"a field goal":lead===3?"a field goal to tie":"a touchdown"}. They have ${g.d.to} timeout${g.d.to===1?"":"s"}.</div>`}
  else if(g.phase==="onside")$("#look").innerHTML=`<div class="k">KICKOFF</div><div class="t">Still down ${g.op-g.my}. Your call.</div><div class="d">Onside kicks work about 1 in 8 times. Kick it deep and you'll need them to punt it back.</div>`;
  else $("#look").innerHTML=`<div class="k">PRE-SNAP READ</div><div class="cues">${L.cues.map(c=>`<span>${c}</span>`).join("")}<span>Extra man shading ${g.leanShown==="L"?"left":"right"}</span></div><div class="d">Looks like <b>${L.name}</b>… but defenses disguise about 1 in 3 snaps.</div>`+
    (g.motionRead?`<div class="mread">🔄 ${g.motionRead}</div>`:g.patPending?"":`<button class="motionb" data-a="motion">🔄 Send a man in motion${g.running?" (costs ~2 sec)":""}</button>`);
  $("#lastplay").innerHTML=feedbackHTML();
  drawCalls();
  $("#log").innerHTML=g.log.map(e=>`<div class="entry ${e.cls||""}">${e.cls==="sys"?"":`<span class="tag">${e.tag}</span>`}<span>${esc(e.text)}</span></div>`).join("");
}
function showRatings(){
  const sc=ctx.sc,R=ROSTERS[sc.id]||{},T=teamR(sc);
  const row=(lbl,name,num,r)=>`<div class="lbrow"><div class="rk" style="font-size:16px">${lbl}</div><div class="who">${esc(name)}${num!=null?` <span class="muted">#${num}</span>`:""}</div><div class="pts" style="color:${rcolor(r)}">${r}</div></div>`;
  openModal(`<button class="x" onclick="closeModal(true)">✕</button><h3>Player ratings</h3><div class="muted" style="margin-bottom:8px">Ratings are Clutch Call's estimates and change the odds on every play.</div>
    ${["QB","RB","X","Z","SL","TE"].map(k=>R[k]?row(POSL[k],R[k][0],R[k][1],R[k][2]):row(POSL[k],({X:"Left WR",Z:"Right WR",SL:"Slot WR",TE:"Tight end",RB:"Running back",QB:"Quarterback"})[k],null,75)).join("")}
    ${row("OL","Offensive line",null,T.ol)}${row("DEF",`${sc.opp} defense`,null,T.dr)}`);
}

function banner(text,color,ms=900){const b=$("#banner");b.textContent=text;b.style.color=color;b.classList.add("show");clearTimeout(b._t);b._t=setTimeout(()=>b.classList.remove("show"),ms)}
function confetti(){const em=["🏈","🎉","✨","🟨","🟩"];for(let i=0;i<40;i++){const s=document.createElement("div");s.className="conf";s.textContent=em[i%em.length];
  s.style.left=Math.random()*100+"vw";s.style.animationDuration=(1.6+Math.random()*1.6)+"s";s.style.animationDelay=Math.random()*.4+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),3800)}}
const buzz=style=>{try{if(NATIVE)return window.webkit.messageHandlers.native.postMessage({type:"haptic",style});navigator.vibrate&&navigator.vibrate({success:[60,40,120],error:200,light:30}[style]||30)}catch(e){}};
async function shareOut(t,okMsg){
  if(NATIVE){window.webkit.messageHandlers.native.postMessage({type:"share",text:t});return}
  try{if(navigator.share){await navigator.share({text:t});return}}catch(e){if(e&&e.name==="AbortError")return}
  try{await navigator.clipboard.writeText(t);toast(okMsg||"Copied to clipboard")}catch(e){prompt("Copy your result:",t)}
}

function lock(on){busy=on;$("#callz")&&$("#callz").classList.toggle("locked",on)}
let feedback=null,coordRunning=false;
const isOffensePlay=a=>/^(run|pass|rpo|trick):/.test(a)||a==="fg"||a==="hail"||a==="spike";
function defCam(){const Y=100-game.d.yl;return clamp(Y-(VH-11),-10,110-VH)}
function setDefenseField(){
  const Y=100-game.d.yl;$("#players").style.opacity=0;$("#trails").innerHTML="";
  placeBall(26.65,Y,0);setLines(Y,Math.max(0,Y-game.d.togo));panCam(defCam());
}
function coordCall(g){const D=g.d,toG=100-D.yl;if(g.time<30&&toG>40)return "soft";if(D.down>=3&&D.togo>=8)return g.rng()<.5?"blitz":"soft";if(toG<20)return "box";return g.rng()<.35?"blitz":"soft"}
function coordStep(){if(!coordRunning)return;if(!game||game.over||game.phase!=="defense"){coordRunning=false;if(game&&!game.over)render();return}doAct("d:"+coordCall(game))}
function doAct(a){
  if(!game||busy||game.over)return;
  SFX.tick();
  const offense=!game.phase&&!game.patPending&&isOffensePlay(a);
  const snap=offense&&store.get("grading",true)?cloneGame(game,1):null;
  const ev=game.act(a);if(!ev)return;
  if(ev.kind==="timeout"){SFX.whistle();render();banner("TIMEOUT","var(--warn)",700);return}
  if(ev.kind==="motion"){SFX.tick();render();return}
  const L=game.last;
  const after=()=>{
    if(offense){let v=null,before=null,grade=null;if(snap){try{before=stateValue(snap);grade=gradeCall(snap,a);v=stateValue(game)}catch(e){}}feedback={L,before,after:v,grade,ev}}
    else if(a.startsWith("d:"))feedback=null;
    render();
    if(game.phase==="defense")setDefenseField();
    else if(!game.over&&!game.patPending&&game.phase!=="onside"){$("#players").style.opacity=1;setFormation(game.yl,game.shown);setLines(game.yl,game.yl+game.togo);panCam(camFor(game.yl));drawRoutes()}
    if(L&&L.play!=="def"&&L.kind!=="none")SFX.whistle();
    if(ev.kind==="over"){
      lock(true);coordRunning=false;
      let big={td:["TOUCHDOWN!","var(--good)"],fg:["IT'S GOOD!","var(--good)"],int:["PICKED OFF","var(--bad)"],fum:["FUMBLE","var(--bad)"],downs:["TURNOVER","var(--bad)"],clock:["TIME'S UP","var(--bad)"],fgmiss:["NO GOOD","var(--bad)"],safety:["SAFETY","var(--bad)"],
        held:["DEFENSE HOLDS!","var(--good)"],oppwin:["THEY SCORE","var(--bad)"],opptie:["THEY TIE IT","var(--warn)"],kneel:["GAME OVER","var(--bad)"]}[ev.reason]||["FINAL","var(--text)"];
      if(L&&L.play==="two")big=game.twoFail?["STOPPED!","var(--bad)"]:["IT'S GOOD!","var(--good)"];
      if(L&&L.play==="xp")big=["TIED UP","var(--warn)"];
      banner(big[0],big[1],1300);
      if(game.result.res==="win"){confetti();buzz("success");SFX.roar()}else if(game.result.res==="loss"){buzz("error");SFX.groan()}else SFX.crowd(1.2,.12);
      setTimeout(()=>{lock(false);endGame(game.result)},1500);return;
    }
    if(ev.kind==="phase"){
      lock(true);
      if(ev.reason==="td"||ev.reason==="fg"){banner(ev.reason==="td"?"TOUCHDOWN!":"IT'S GOOD!","var(--good)",1200);confetti();buzz("success");SFX.roar()}
      else if(ev.reason==="fgmiss"){banner("NO GOOD","var(--bad)",1100);SFX.groan()}
      else if(ev.phase==="offense"){banner(L&&L.o==="int"?"PICKED OFF!":"YOUR BALL!","var(--good)",1100);SFX.roar()}
      setTimeout(()=>{lock(false);if(ev.phase==="offense"){$("#players").style.opacity=1;setFormation(game.yl,game.shown);setLines(game.yl,game.yl+game.togo);setCam(camFor(game.yl))}render()},1250);return;
    }
    if(ev.kind==="onside"||ev.kind==="punt"){banner(ev.kind==="onside"?"RECOVERED!":"ONE MORE SHOT","var(--good)",1100);SFX.roar();$("#players").style.opacity=1;setFormation(game.yl,game.shown);setLines(game.yl,game.yl+game.togo);setCam(camFor(game.yl));lock(false);render();return}
    if(ev.kind==="pat"){banner("TOUCHDOWN!","var(--good)",1100);confetti();buzz("success");SFX.roar();setTimeout(()=>{lock(false);showPAT()},1200);return}
    if(ev.kind==="def"){
      lock(false);
      const o=ev.o;if(o==="sack"){banner("SACK!","var(--good)",700);SFX.thud();SFX.crowd(1,.16)}else if(o==="inc"){banner("INCOMPLETE","var(--good)",600);SFX.crowd(.8,.1)}
      else if(ev.yards>=15){banner(`+${ev.yards} THEM`,"var(--bad)",700);SFX.groan()}else if(o==="stuff"){banner("STUFFED!","var(--good)",600);SFX.thud()}else SFX.thud();
      if(coordRunning)setTimeout(coordStep,800);return;
    }
    lock(false);
    if(ev.kind==="spike"){banner("SPIKE","var(--info)",600);return}
    if(L&&(L.kind==="inc"))SFX.crowd(.6,.06);else if(L&&L.kind==="sack"){SFX.thud();SFX.groan()}else SFX.thud();
    if(ev.banner){banner(ev.banner[0],ev.banner[1]);if(ev.first){buzz("light");SFX.crowd(1.2,.14)}}
    else if(ev.yards>=15){banner(`+${ev.yards}`,"var(--good)",700);SFX.crowd(1.2,.16)}
  };
  if(!L||L.kind==="none"||L.play==="def"){after();return}
  lock(true);$("#fdl").style.opacity=0;$("#trails").innerHTML="";$("#players").style.opacity=1;
  if(L.play==="fg")SFX.kick();else SFX.hike();
  animatePlay(L,after);
}
function feedbackHTML(){
  const g=game,f=feedback;

  if(!f||!f.L||g.phase==="defense"){
    const last=g.log[0];return last&&last.tag!=="KICK"?`<div class="entry ${last.cls||""}">${last.cls==="sys"?"":`<span class="tag">${last.tag}</span>`}<span>${esc(last.text)}</span></div>`:"";
  }

/* ================= RESULTS ================= */
const tier=r=>r==="win"?2:r==="tie"?1:0;
const verdict=r=>r.res==="win"?["YOU WIN","var(--good)"]:r.res==="tie"?["OVERTIME","var(--warn)"]:["YOU LOSE","var(--bad)"];
function points(r){return r.res==="win"?1000+Math.max(0,15-r.plays)*20+(r.reason==="td"?100:0):r.res==="tie"?500+r.yards:Math.min(400,r.yards*4)}
function endGame(r){
  if(ctx.challenge){showChallengeResult(r);return}
  if(ctx.daily){
    const sc=ctx.sc,cmp=sc.real?Math.sign(tier(r.res)-tier(sc.real.res)):0;
    const rec={...r,n:N,id:sc.id,pts:points(r),cmp,sc:{game:sc.game,team:sc.team,opp:sc.opp,date:sc.date,line:sitLine(sc),real:sc.real}};
    store.set("d"+N,rec);
    const st=store.get("stats",{played:0,wins:0,ties:0,streak:0,best:0,beat:0,last:0});
    st.played++;if(r.res==="win")st.wins++;if(r.res==="tie")st.ties++;if(cmp>0)st.beat++;
    st.streak=r.res==="win"?(st.last===N-1?st.streak+1:1):0;st.best=Math.max(st.best,st.streak);st.last=r.res==="win"?N:st.last;
    store.set("stats",st);
    showResult(rec);
    submitScore("daily",rec.pts,`${r.res.toUpperCase()} · ${r.why}`,N);
  }else if(ctx.practice){
    const sc=ctx.sc;showResult({...r,n:N,pts:points(r),practice:true,cmp:sc.real?Math.sign(tier(r.res)-tier(sc.real.res)):0,sc:{game:sc.game,team:sc.team,opp:sc.opp,date:sc.date,line:sitLine(sc),real:sc.real}});
  }else showSurvivor(r);
}
function cmpText(c,real){if(!real)return "";return c>0?"📜✏️ You rewrote history":c<0?"📜 History did better":"📜 You matched history"}

    <div><div class="who">WHAT REALLY HAPPENED</div><div class="what">${esc(rec.sc.team)} ${rv}</div><div class="how">${esc(real.short)}</div></div></div>

function statsHTML(){const s=store.get("stats",{played:0,wins:0,streak:0,best:0,beat:0});

function tickCountdown(){clearInterval(cdT);const f=()=>{const e=$("#cd");if(!e)return clearInterval(cdT);const d=new Date(),m=new Date(d);m.setHours(24,0,0,0);

const lbHeaders=()=>Object.assign({apikey:LB_KEY,"Content-Type":"application/json"},LB_KEY.startsWith("eyJ")?{Authorization:"Bearer "+LB_KEY}:{});
function myName(){return store.get("name","")}
function askName(then){
  openModal(`<h3>Pick a leaderboard name</h3><div class="muted">This shows up next to your scores. 2–16 characters.</div>
    <input class="name" id="nm" maxlength="16" placeholder="e.g. Samad" value="${esc(myName())}" autocomplete="off">
    <button class="big" id="nmok">SAVE</button><button class="ghost" onclick="closeModal()">Not now</button>`);
  const i=$("#nm");setTimeout(()=>i.focus(),100);
  $("#nmok").onclick=()=>{const v=i.value.trim().replace(/\s+/g," ");if(v.length<2){toast("At least 2 characters");return}store.set("name",v);closeModal(true);then&&then()};
}
function queue(body){const q=store.get("lbQueue",[]);q.push(body);store.set("lbQueue",q.slice(-10))}
async function submitScore(mode,score,detail,day){
  if(!LB_URL||!LB_KEY)return;
  const body={name:myName(),mode,score,detail:String(detail).slice(0,190),day:day??null};
  if(!body.name){queue(body);return}
  try{const r=await fetch(LB_URL+"/rest/v1/scores",{method:"POST",headers:Object.assign(lbHeaders(),{Prefer:"return=minimal"}),body:JSON.stringify(body)});
    if(!r.ok)throw new Error(r.status+" "+(await r.text()).slice(0,120));
    store.set("lbErr","");}
  catch(e){store.set("lbErr",String(e.message||e));queue(body)}
}
async function flushQueue(){const q=store.get("lbQueue",[]);if(!q.length||!myName())return;store.set("lbQueue",[]);for(const b of q){b.name=myName();await submitScore(b.mode,b.score,b.detail,b.day)}}
async function fetchBoard(kind){
  const q=kind==="survivor"?"mode=eq.survivor&order=score.desc,created_at.asc&limit=200":`mode=eq.daily&day=eq.${N}&order=score.desc,created_at.asc&limit=200`;
  const r=await fetch(`${LB_URL}/rest/v1/scores?select=name,score,detail,created_at&${q}`,{headers:lbHeaders()});
  if(!r.ok)throw new Error(r.status+" "+(await r.text()).slice(0,140));
  const rows=await r.json(),seen=new Set(),out=[];
  for(const x of rows){const k=x.name.toLowerCase();if(seen.has(k))continue;seen.add(k);out.push(x)}
  return out;
}
let lbKind="survivor";
async function showLeaderboard(kind){
  lbKind=kind||lbKind;
  if(!myName()&&store.get("lbQueue",[]).length)return askName(()=>showLeaderboard(kind));
  openModal(`<button class="x" onclick="closeModal()">✕</button><h3>Leaderboard</h3>
    <div class="lbtabs"><button data-k="survivor" class="${lbKind==="survivor"?"on":""}">SURVIVOR · ALL TIME</button><button data-k="daily" class="${lbKind==="daily"?"on":""}">TODAY · #${N}</button></div>
    <div id="lbbody" class="muted" style="padding:14px 0;text-align:center">Loading…</div>
    <button class="ghost" id="lbname">${myName()?`Playing as <b>${esc(myName())}</b> · change`:"Set your leaderboard name"}</button>`);
  document.querySelectorAll(".lbtabs button").forEach(b=>b.onclick=()=>showLeaderboard(b.dataset.k));
  $("#lbname").onclick=()=>askName(()=>showLeaderboard(lbKind));
  await flushQueue();
  try{
    const rows=await fetchBoard(lbKind),me=myName().toLowerCase(),body=$("#lbbody");if(!body)return;
    if(!rows.length){body.innerHTML=lbKind==="survivor"?"No runs yet. Win at least one drive in Survivor to get on the board.":"Nobody has finished today's drive yet. Be the first.";return}
    const myIdx=rows.findIndex(x=>x.name.toLowerCase()===me);
    const show=rows.slice(0,25);
    body.style.textAlign="left";body.classList.remove("muted");
    body.innerHTML=show.map((x,i)=>`<div class="lbrow ${x.name.toLowerCase()===me?"me":""} ${i<3?"top"+(i+1):""}"><div class="rk">${i<3?["🥇","🥈","🥉"][i]:i+1}</div>
      <div class="who">${esc(x.name)}<small>${esc(x.detail||"")}</small></div><div class="pts">${x.score}${lbKind==="survivor"?`<span class="muted" style="font-size:14px"> drive${x.score===1?"":"s"}</span>`:""}</div></div>`).join("")
      +(myIdx>=25?`<div class="lbrow me"><div class="rk">${myIdx+1}</div><div class="who">${esc(rows[myIdx].name)}</div><div class="pts">${rows[myIdx].score}</div></div>`:"")
      +(myIdx<0&&myName()?`<div class="muted" style="text-align:center;margin-top:8px;font-size:13px">You're not on this board yet.</div>`:"");
  }catch(e){const body=$("#lbbody");if(body)body.innerHTML=`Couldn't load the leaderboard.<br><small>${esc(e.message||e)}</small>`}
}

    ${h2hHTML(name,me,ch.from.n,them)}
    <button class="big" id="back">SEND YOUR RESULT BACK</button><button class="ghost" id="newc">Challenge them on another drive</button></div>`);
  $("#back").onclick=()=>shareOut(`${w>0?"😤 Beat you":w<0?"You got me":"Dead even"} on ${sc.game}: ${me.pts} vs your ${them.pts}.\n${back}`,"Result link copied");
  $("#newc").onclick=()=>{closeModal(true);showChallengePicker()};
}
function showSettings(){
  const cur=store.get("theme","broadcast"),snd=store.get("sound",true),gr=store.get("grading",true);
  openModal(`<button class="x" onclick="closeModal(true)">✕</button><h3>Settings</h3>
  <button class="tog ${snd?"on":""}" id="tsnd"><span><b>Sound</b><small>Crowd, whistles and the snap</small></span><i></i></button>
  <button class="tog ${gr?"on":""}" id="tgr"><span><b>Grade my calls</b><small>Win chance and how every option scored after each play</small></span><i></i></button>
  <h3 style="font-size:26px;margin-top:14px">Theme</h3>
  <div class="themes">${THEMES.map(([k,n,d])=>`<button class="th ${k===cur?"on":""}" data-th="${k}"><div class="sw" data-theme="${k}" style="background:var(--bg)">
    <div style="background:var(--grass1)"><svg width="74" height="34"><circle cx="16" cy="17" r="8" style="fill:var(--off);stroke:var(--offs)" stroke-width="2"/><circle cx="37" cy="17" r="8" style="fill:var(--off);stroke:var(--offs)" stroke-width="2"/><circle cx="58" cy="10" r="8" style="fill:var(--def);stroke:var(--defs)" stroke-width="2"/></svg></div>
    <div style="background:var(--sb);color:var(--clock);font-family:Teko,Impact,sans-serif;font-size:26px">2:00</div></div><div class="lab">${n}<small>${d}</small></div></button>`).join("")}</div>`);
  $("#tsnd").onclick=()=>{store.set("sound",!snd);if(!snd){SFX.unlock();SFX.whistle()}showSettings()};
  $("#tgr").onclick=()=>{store.set("grading",!gr);showSettings()};
  document.querySelectorAll("[data-th]").forEach(b=>b.onclick=()=>{store.set("theme",b.dataset.th);applyTheme(b.dataset.th);showSettings()});
}

/* ================= THEMES / HELP ================= */
const THEMES=[["broadcast","Broadcast","TV-style navy, red & white"],["clean","Clean","Bright, minimal, black & green"],["retro","Retro","70s cream & burnt orange"],["midnight","Midnight","The original dark stadium look"],["neon","Neon","Arcade black with cyan & pink"]];
function showThemes(){
  const cur=store.get("theme","broadcast");
  openModal(`<button class="x" onclick="closeModal()">✕</button><h3>Theme</h3><div class="muted">Tap to try one. It's saved on this device.</div>
  <div class="themes">${THEMES.map(([k,n,d])=>`<button class="th ${k===cur?"on":""}" data-th="${k}"><div class="sw" data-theme="${k}" style="background:var(--bg)">
    <div style="background:var(--grass1)"><svg width="74" height="34"><circle cx="16" cy="17" r="8" style="fill:var(--off);stroke:var(--offs)" stroke-width="2"/><circle cx="37" cy="17" r="8" style="fill:var(--off);stroke:var(--offs)" stroke-width="2"/><circle cx="58" cy="10" r="8" style="fill:var(--def);stroke:var(--defs)" stroke-width="2"/></svg></div>
    <div style="background:var(--sb);color:var(--clock);font-family:Teko,Impact,sans-serif;font-size:26px">2:00</div></div>
    <div class="lab">${n}<small>${d}</small></div></button>`).join("")}</div>`);
  document.querySelectorAll("[data-th]").forEach(b=>b.onclick=()=>{store.set("theme",b.dataset.th);applyTheme(b.dataset.th);showThemes()});
}
function showHelp(){
  openModal(`<button class="x" onclick="closeModal()">✕</button><h3>How to play</h3>
  <ol class="help" style="padding-left:18px">
   <li>Every day there's one <b>real final drive</b> from NFL history, the same for everyone. You start with the real score, clock and field position.</li>
   <li><b>Read the defense.</b> Before each snap you get clues: where the safeties are, how tight the corners play, how many are in the box. About 1 in 3 snaps they disguise it and rotate after the snap.</li>
   <li><b>Call the play.</b> RUN lets you pick the type and the side (run away from the extra defender). PASS shows every receiver with his catch odds: tap a route to change it, add play action or a rollout, then tap who gets the ball. RPO lets your QB read it after the snap. TRICK plays each work once per drive.</li>
   <li><b>Motion:</b> before the snap you can send a man in motion. If a defender follows him it's man coverage; if not, it's zone.</li>
   <li><b>Score with time left and you're on defense.</b> Blitz, load the box or play it soft, or let your coordinator call it. Still trailing after you score? Try an onside kick.</li>
   <li><b>After every play</b> you see your win chance and how your call ranked against every other option.</li>
   <li><b>1v1:</b> play any drive and send the link. Your friend gets the same drive and the same luck.</li>
   <li><b>Ratings matter.</b> Each player's ring color shows how good he is, and it changes the odds.</li>
   <li><b>Manage the clock.</b> When it's running, about 15–20 seconds burn before your next snap. Incompletions and plays out of bounds stop it. Timeouts and spikes save time.</li>
   <li><b>Know what you need.</b> A field goal only helps if you're down 3 or less. Score too early and the other team gets the ball back.</li>
   <li>When you finish, see <b>what really happened</b> and whether you rewrote history.</li>
   <li><b>Survivor</b> runs every famous drive back to back. Your best run goes on the leaderboard.</li>
  </ol>
  <div class="chips"><span>🟩 First down</span><span>🟨 Gain</span><span>⬜ No gain</span><span>🟧 Sack</span><span>⏸️ Spike</span><span>🟥 Turnover</span><span>🏈 TD</span><span>🎯 FG</span></div>
  <p class="muted" style="font-size:12px">Scores, clock and field position come from the real games. Timeouts are a best estimate where records don't list them. Not affiliated with the NFL.</p>
  <button class="big" onclick="closeModal()">LET'S GO</button>`);
  store.set("seenHelp2",1);
}
function openModal(h){$("#modal").innerHTML=h;$("#mback").classList.add("show");$("#modal").scrollTop=0}
function closeModal(silent){$("#mback").classList.remove("show");clearInterval(cdT);if(!silent&&game&&game.over)renderHome()}
$("#mback").onclick=e=>{if(e.target.id==="mback")closeModal()};
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1600)}

renderHome();

if(_c){const c=b64d(_c);try{history.replaceState(null,"",location.pathname)}catch(e){}if(c){store.set("seenHelp2",1);openChallenge(c)}}
else if(!store.get("seenHelp2",0))showHelp();
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
