name: Update drives

on:
  schedule:
    - cron: "17 9 * * *"   # every day, ~5 AM Eastern
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: drives
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas
      - name: Find this season's best late drives
        run: python tools/update_drives.py --out drives_auto.json
      - name: Commit if changed
        run: |
          if git diff --quiet -- drives_auto.json; then echo "No new drives"; exit 0; fi
          git config user.name "clutch-call-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drives_auto.json
          git commit -m "Update drives ($(date -u +%F))"
          git push
